name: vectors

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: rescore even if VeIR main has not moved
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vectors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: veir-sqlite

      - name: Validate vector tracking inputs
        working-directory: veir-sqlite
        run: |
          python3 vectors/update.py --check
          python3 -m unittest discover -s tests -p test_vectors.py

      - name: Has VeIR moved?
        id: veir
        working-directory: veir-sqlite
        env:
          FORCE: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.force == true }}
        run: |
          sha=$(git ls-remote https://github.com/opencompl/veir.git refs/heads/main | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          scored=$(grep '^| veir |' VECTORS.md | grep -oE '[0-9a-f]{40}' | head -1 || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$scored" ] && [ "$FORCE" != true ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.veir.outputs.stale == 'true'
        with:
          repository: opencompl/veir
          ref: ${{ steps.veir.outputs.sha }}
          path: veir

      - name: Build veir-opt
        if: steps.veir.outputs.stale == 'true'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: veir
          build-args: "veir-opt"
          test: false

      - name: Score vector cases
        if: steps.veir.outputs.stale == 'true'
        working-directory: veir-sqlite
        run: |
          python3 vectors/score.py --veir ../veir --json-out "$RUNNER_TEMP/vector-results.json"
          cat VECTORS.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.veir.outputs.stale == 'true'
        with:
          name: vector-results
          path: ${{ runner.temp }}/vector-results.json

      - name: Commit refreshed report
        if: steps.veir.outputs.stale == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: veir-sqlite
        env:
          VEIR_SHA: ${{ steps.veir.outputs.sha }}
        run: |
          git add VECTORS.md
          if git diff --cached --quiet -- VECTORS.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "vectors: update support for veir ${VEIR_SHA:0:12}"
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main
