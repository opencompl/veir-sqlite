name: leadership

# Keeps LEADERSHIP.md current with veir's main branch.
#
# GitHub Actions cannot subscribe to another repository, so this polls: every
# ten minutes it compares veir's main with the commit LEADERSHIP.md was last
# scored against (the `veir` row of its Provenance table) and stops there, in
# seconds, if nothing moved. A public repository's minutes are free and the
# cron floor is five; scheduled runs are low priority for GitHub and can start
# late under load, so "ten minutes" means "usually within the hour". If veir
# did move, it checks veir out at that commit, builds veir-opt, scores the
# committed O3 corpus and commits the new LEADERSHIP.md to main as
# github-actions[bot]. That push is made with GITHUB_TOKEN, so it triggers no
# workflow: no loop. A push to main here (new corpus, new scorer) rescores
# immediately, and the workflow can be run by hand, with `force` to rescore an
# unchanged veir.
#
# Every SQLite chunk must pass strict verification and reparsing. A regression
# fails CI and uploads its report; LEADERSHIP.md retains the last passing run.

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: rescore even if veir's main has not moved
        type: boolean
        default: false

permissions:
  contents: write

# Both trackers push to main; serialize their full read/score/publish cycle.
# PRs and non-main runs have separate groups because they do not publish.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'report-updates-main' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: veir-sqlite
          # Read current main after acquiring the shared concurrency group.
          # PRs and non-main runs retain checkout's default event revision.
          ref: ${{ github.ref == 'refs/heads/main' && github.ref || '' }}

      - name: Validate SQLite inputs and tests
        working-directory: veir-sqlite
        run: |
          python3 update-sqlite.py --verify
          python3 -m unittest discover -s tests -p 'test_sqlite.py'

      - name: Has veir moved?
        id: veir
        working-directory: veir-sqlite
        env:
          FORCE: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.force == true }}
        run: |
          sha=$(git ls-remote https://github.com/opencompl/veir.git refs/heads/main | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          # The Provenance row names the commit veir was scored at (linked,
          # possibly as tag-N-gCOMMIT); the 40-character hash is the commit.
          scored=$(grep '^| veir |' LEADERSHIP.md | grep -o '[0-9a-f]\{40\}' | head -1)
          echo "veir main: $sha; scored: ${scored:-none}; force: $FORCE"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$scored" ] && [ "$FORCE" != true ]; then
            echo "LEADERSHIP.md is current; nothing to do."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.veir.outputs.stale == 'true'
        with:
          repository: opencompl/veir
          ref: ${{ steps.veir.outputs.sha }}
          path: veir

      # Only veir-opt is needed; lean-action installs elan and caches .lake.
      - name: Build veir-opt
        if: steps.veir.outputs.stale == 'true'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: veir
          build-args: "veir-opt"
          test: false

      - name: Score
        id: score
        if: steps.veir.outputs.stale == 'true'
        working-directory: veir-sqlite
        run: |
          ./make-leadership.py --veir ../veir --veir-opt ../veir/.lake/build/bin/veir-opt \
            --require-supported --json-out "$RUNNER_TEMP/sqlite-results.json" \
            --out "$RUNNER_TEMP/sqlite-report.md"

      - name: Report result
        if: ${{ !cancelled() && steps.score.outcome != 'skipped' }}
        working-directory: veir-sqlite
        run: |
          if test -f "$RUNNER_TEMP/sqlite-report.md"; then
            cat "$RUNNER_TEMP/sqlite-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.score.outcome != 'skipped' }}
        with:
          name: sqlite-results
          path: |
            ${{ runner.temp }}/sqlite-results.json
            ${{ runner.temp }}/sqlite-report.md

      - name: Commit
        if: steps.score.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: veir-sqlite
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/sqlite-report.md" LEADERSHIP.md
          ./leadership-commit-message.py "$RUN_URL" > "$RUNNER_TEMP/message"
          git add LEADERSHIP.md
          if git diff --cached --quiet -- LEADERSHIP.md; then
            exit 0
          fi
          git commit --quiet -F "$RUNNER_TEMP/message"
          git show --stat --format=%B HEAD
          # Someone may have pushed meanwhile; their commits do not touch this file.
          git pull --quiet --rebase origin main
          git push --quiet origin HEAD:main
